name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos: leer el repo y publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Las actions están fijadas a un commit (SHA) y no a una etiqueta, para que
      # nadie pueda cambiar el código que corre acá moviendo la etiqueta.
      # Para actualizar: buscar el SHA del release nuevo y reemplazarlo junto con el comentario.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Se vuelve a compilar el CSS de Tailwind a partir de los HTML, así lo publicado
      # siempre coincide con las clases actuales aunque no se haya compilado en local.
      # npm ci instala exactamente las versiones de package-lock.json.
      - name: Compilar CSS de Tailwind
        run: |
          npm ci --ignore-scripts
          npm run build:css

      # Solo se publican los archivos del sitio: la documentación y la config quedan afuera.
      - name: Preparar archivos del sitio
        run: |
          mkdir _site
          cp *.html robots.txt sitemap.xml _site/
          cp -r assets _site/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
